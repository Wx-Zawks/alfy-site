server:
  port: 8080

spring:
  application:
    name: alfy-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-migration-naming: true
    clean-disabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: info
    com.alfy.api: debug

alfy:
  content-import:
    # 只能通过显式环境变量或启动参数启用，避免正常启动时误导入。
    enabled: ${ALFY_CONTENT_IMPORT_ENABLED:false}
    package-path: ${ALFY_CONTENT_IMPORT_PACKAGE:../docs/content-import-draft}
    source-root: ${ALFY_CONTENT_IMPORT_SOURCE_ROOT:../docs/奥飞网站}
    storage-root: ${ALFY_CONTENT_STORAGE_ROOT:./data/alfy/uploads}
