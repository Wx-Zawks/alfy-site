server:
  port: 8080

spring:
  application:
    name: alfy-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-migration-naming: true
    clean-disabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: info
    com.alfy.api: debug