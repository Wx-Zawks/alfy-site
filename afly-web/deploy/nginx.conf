# ALFY 官网 nginx 加速配置示例
# 作用：gzip 压缩、静态资源长缓存、API 反代，显著提升首屏与图片加载速度。
#
# 使用方式（二选一）：
#   A. 所有服务在同一 docker-compose 网络：将 upstream 中的 web/api 改为 compose 服务名。
#   B. 直接部署在宿主机：将 upstream 改为 127.0.0.1:3000 和 127.0.0.1:8080。
#
# 生效后建议将 Nuxt 的 NUXT_PUBLIC_API_BASE 设置为同源相对路径 /api/v1，
# 让浏览器请求走 nginx 反代，享受连接复用与 gzip。

upstream alfy_web {
    server web:3000;        # Nuxt (Nitro) 容器/进程
    keepalive 32;
}

upstream alfy_api {
    server api:8080;        # Spring Boot 后端
    keepalive 32;
}

server {
    listen 80;
    server_name _;          # 有域名后改为实际域名

    # ---- gzip 压缩 ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    client_max_body_size 20m;

    # ---- 带 hash 的构建产物：永久缓存 ----
    location /_nuxt/ {
        proxy_pass http://alfy_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 站内图片：缓存 7 天 ----
    location /images/ {
        proxy_pass http://alfy_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 后端 API（含 CMS 媒体 /api/v1/public/media/{id}，后端已自带 30 天缓存头）----
    location /api/ {
        proxy_pass http://alfy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ---- 其余请求：Nuxt SSR ----
    location / {
        proxy_pass http://alfy_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
